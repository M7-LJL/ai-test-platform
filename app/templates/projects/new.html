{% extends "base.html" %}

{% block title %}创建新项目{% endblock %}

{% block content %}
<div class="card">
    <h1>创建新项目</h1>
    <p class="muted">填写项目基础信息后提交。</p>
    <div class="page-actions">
        <a class="btn btn-secondary" href="/projects">返回项目列表</a>
    </div>

    <form method="post" action="/projects/new">
        <label for="name">项目名</label>
        <input id="name" name="name" type="text" placeholder="请输入项目名" required>

        <label for="description">描述</label>
        <textarea id="description" name="description" rows="6" placeholder="请输入项目描述"></textarea>

        <button class="btn" type="submit">创建项目</button>
    </form>
</div>
{% endblock %}
